// Created from template at https://docs.gradle.org/current/userguide/publishing_maven.html#publishing_maven:complete_example

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    id "io.github.gradle-nexus.publish-plugin" version "1.3.0"
}

sourceCompatibility = 1.8
targetCompatibility = 1.8

group = 'com.lacunasoftware.restpki'
archivesBaseName = 'restpkicore-client'
version = '1.2.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.12.1'
    implementation 'io.swagger.core.v3:swagger-annotations:2.0.0'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.12.1'
}

java {
    withJavadocJar()
    withSourcesJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = 'com.lacunasoftware.restpki'
            artifactId = 'restpkicore-client'
            from components.java
            pom {
                name = 'Rest PKI Core client library for Java 8+'
                description = 'Classes to consume Lacuna Software REST PKI Core'
                url = 'https://github.com/LacunaSoftware/RestPkiNGJavaClient'
                licenses {
                    license {
                        name = 'Unlicense'
                    }
                }
                developers {
                    developer {
                        id = 'LeonardoP'
                        name = 'Leonardo Pignataro'
                        email = 'leonardop@lacunasoftware.com'
                    }
                }
                scm {
                    connection = 'scm:git:git@github.com:LacunaSoftware/RestPkiNGJavaClient.git'
                    developerConnection = 'scm:git:git@github.com:LacunaSoftware/RestPkiNGJavaClient.git'
                    url = 'https://github.com/LacunaSoftware/RestPkiNGJavaClient'
                }
            }
        }
    }
    repositories {
        maven {
            name = "OSSRH"
            def releasesRepoUrl = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
            def snapshotsRepoUrl = "https://central.sonatype.com/repository/maven-snapshots/"
            url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
            credentials {
                username = sonatypeUsername
                password = sonatypePassword
            }
        }
    }
}

nexusPublishing {
    repositories {
        sonatype {
            // Use the new Portal OSSRH Staging API endpoint
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
            
            username = sonatypeUsername
            password = sonatypePassword
        }
    }
}

signing {
    sign publishing.publications.mavenJava
    sign configurations.archives
}
